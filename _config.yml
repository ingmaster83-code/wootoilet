title: 우아화장실 - 전국 공중화장실·개방화장실 위치 찾기
description: >-
  전국 공중화장실·개방화장실의 위치와 개방시간, 변기 수를 동네별로 확인하세요.
url: "https://wootoilet.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/
  - _rawdata/

# 설계 메모: 행안부 LOCALDATA 화장실 인허가 CSV(영업/정상)를 가공한 _rawdata/tl_{시도}.json 으로
# 시도→시군구→동 허브 + 종류×(시도/시군구/동) 허브 + 시설 상세를 생성한다. 사이트맵은 tl_generator.rb 분할본.
